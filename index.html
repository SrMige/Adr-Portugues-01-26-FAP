                    savedStartIndices = {

                    };
                }
            } catch (error) {
                console.warn('Não foi possível carregar o progresso salvo:', error);
            }
        }

        function persistSavedStartIndices() {
            try {
                localStorage.setItem('adrSavedStartIndices', JSON.stringify(savedStartIndices));
            } catch (error) {
                console.warn('Não foi possível salvar o progresso:', error);
            }
        }

        function saveCurrentNormalProgress() {
            if (!isRandomMode && !isExtremeRandomMode && !isFailedMode) {
                savedStartIndices[selectedBank] = currentStartIndex;
                persistSavedStartIndices();
            }
        }

        function restoreStartIndexForBank(bank) {
            currentStartIndex = Math.min(savedStartIndices[bank] || 0, currentQuestions.length - 1);
        }

        function getQuizLength() {
            if (!isRandomMode && !isExtremeRandomMode) {
                return Math.min(Math.max(currentQuestions.length - currentStartIndex, 0), quizLimit[selectedBank]);
            }
return Math.min(currentQuestions.length, quizLimit[selectedBank]);        }

        function buildCurrentSequence() {
            if (isRandomMode || isExtremeRandomMode) {
                return shuffleArray([...Array(currentQuestions.length).keys()]).slice(0, getQuizLength());
            } else if (isFailedMode) {
                // Filter questions with wrong counts > 0 and correct counts < 2, then sort by wrong count descending
                const counts = wrongCounts[selectedBank];
                const correct = correctCounts[selectedBank];
                const filteredIndexes = [...Array(currentQuestions.length).keys()].filter(qIndex => (counts[qIndex] || 0) > 0 && (correct[qIndex] || 0) < 2);
                const sortedIndexes = filteredIndexes.sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
                return sortedIndexes.slice(0, getQuizLength());
            }
            return Array.from({ length: getQuizLength() }, (_, i) => currentStartIndex + i);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

                const answer = answers[qIndex];
                if (answer !== undefined) {
                    if (answer === q.correctAnswerIndex) {
                        correct++;
                    } else {
                        incorrect++;
                    }
                }
            });
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;
            document.getElementById('answeredCount').textContent = correct + incorrect;
        }

        function getCurrentQuestionIndex() {
            if (!currentSequence.length) {

                currentSequenceIndex = 0;
            }
            if (currentSequenceIndex >= currentSequence.length) {
                currentSequenceIndex = Math.max(currentSequence.length - 1, 0);
            }
            return currentSequence[currentSequenceIndex];

            questionText.textContent = `${questionNumber}. ${q.text}`;

            const optionsDiv = document.createElement('div');

            const isAnswered = answeredQuestions[selectedBank].includes(qIndex);

            const optionEntries = q.options.map((option, index) => ({ option, originalIndex: index }));
            const displayOptions = isExtremeRandomMode ? shuffleArray([...optionEntries]) : optionEntries;

            displayOptions.forEach(({ option, originalIndex }) => {
                const label = document.createElement('label');
                label.id = `option-${originalIndex}`;
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'answer';
                radio.value = originalIndex;
                if (userAnswers[selectedBank][qIndex] === originalIndex) {
                    radio.checked = true;
                }
                radio.addEventListener('change', () => {
                    userAnswers[selectedBank][qIndex] = originalIndex;
                    showInstantFeedback(originalIndex, q.correctAnswerIndex);
                    const radios = document.querySelectorAll('input[name="answer"]');
                    radios.forEach(radio => radio.disabled = true);
                    // Mark question as answered
                    if (!answeredQuestions[selectedBank].includes(qIndex)) {
                        answeredQuestions[selectedBank].push(qIndex);
                    }
                    // Track wrong answers
                    if (originalIndex !== q.correctAnswerIndex) {
                        if (!wrongQuestions[selectedBank].includes(qIndex)) {
                            wrongQuestions[selectedBank].push(qIndex);
                        }
                        // Increment wrong count
                        if (!wrongCounts[selectedBank][qIndex]) {
                            wrongCounts[selectedBank][qIndex] = 0;
                        }
                        wrongCounts[selectedBank][qIndex]++;
                    } else {
                        const wrongIndex = wrongQuestions[selectedBank].indexOf(qIndex);
                        if (wrongIndex !== -1) {
                            wrongQuestions[selectedBank].splice(wrongIndex, 1);
                        }
                        // Increment correct count
                        if (!correctCounts[selectedBank][qIndex]) {
                            correctCounts[selectedBank][qIndex] = 0;
                        }
                        correctCounts[selectedBank][qIndex]++;
                    }
                    updateScoreDisplay();
                });
                label.appendChild(radio);
                label.appendChild(document.createTextNode(option));
                optionsDiv.appendChild(label);
            });

            questionDiv.appendChild(optionsDiv);
            quizContainer.appendChild(questionDiv);

            // If already answered, show feedback
            if (isAnswered && userAnswers[selectedBank][qIndex] !== undefined) {
                showInstantFeedback(userAnswers[selectedBank][qIndex], q.correctAnswerIndex);
            }

            updateButtons();
        }

        function showInstantFeedback(selectedIndex, correctIndex) {
            // Reset all options
            const currentQ = currentQuestions[getCurrentQuestionIndex()];
            for (let i = 0; i < currentQ.options.length; i++) {
                const label = document.getElementById(`option-${i}`);
                if (label) {
                    label.classList.remove('correct-answer', 'incorrect-selection');
                }
            }

            // Mark correct answer
            const correctLabel = document.getElementById(`option-${correctIndex}`);
            if (correctLabel) {
                correctLabel.classList.add('correct-answer');
            }

            // If user selected wrong answer, mark it
            if (selectedIndex !== correctIndex) {
                const wrongLabel = document.getElementById(`option-${selectedIndex}`);
                if (wrongLabel) {
                    wrongLabel.classList.add('incorrect-selection');
                }
            }

            // Disable radio buttons after answering
            const radios = document.querySelectorAll('input[name="answer"]');
            radios.forEach(radio => radio.disabled = true);
        }

        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            resetPaging();
            currentSequence = buildCurrentSequence();
            userAnswers[selectedBank] = [];
            answeredQuestions[selectedBank] = [];
            wrongQuestions[selectedBank] = [];
            // Note: Keeping wrongCounts and correctCounts for history
            isRandomMode = false;
            isFailedMode = false;
            isExtremeRandomMode = false;
            isTestMode = false;
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.querySelector('.navigation-buttons').style.display = 'block';
            document.getElementById('normalModeBtn').style.backgroundColor = '#007bff';
            document.getElementById('randomModeBtn').style.backgroundColor = '#6c757d';
            document.getElementById('failedModeBtn').style.backgroundColor = '#6c757d';
            document.getElementById('extremeRandomModeBtn').style.backgroundColor = '#6c757d';
            document.getElementById('continueBtn').style.display = 'none';
            updateScoreDisplay();
            startTimer();
            renderQuestions();
        });

        // Initialize the quiz
        loadSavedStartIndices();
        highlightBankButton();
        restoreStartIndexForBank(selectedBank);
        currentSequence = buildCurrentSequence();
        
        // Easter egg
        document.getElementById('easterEggTrigger').addEventListener('click', () => {
            const password = prompt('🔐 Insira a senha para revelar um segredo:');
            if (password === 'FAP') {
                alert('✨ Criador do Programa:\n\n1Cab/Caut/Chilian 01/26 ADR\n\n🎓 ADR by Chili Com Carne');
            } else if (password !== null) {
                alert('❌ Senha incorreta!');
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Se está em um input ou textarea, ignora os atalhos
            if (e.target.tagName === 'INPUT' && e.target.type !== 'radio' || e.target.tagName === 'TEXTAREA') {
                return;
            }
            
            // Teclas 1, 2, 3 para selecionar respostas
            if (['1', '2', '3'].includes(e.key)) {
                const optionIndex = parseInt(e.key) - 1;
                const radio = document.querySelector(`input[name="answer"][value="${optionIndex}"]`);
                if (radio) {
                    radio.click();
                    e.preventDefault();
                }
            }
            
            // Enter para próxima pergunta
            if (e.key === 'Enter') {
                const submitBtn = document.getElementById('submitBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (submitBtn && submitBtn.style.display !== 'none') {
                    submitBtn.click();
                    e.preventDefault();
                } else if (nextBtn && nextBtn.style.display !== 'none') {
                    nextBtn.click();
                    e.preventDefault();
                }
            }
        });
        
        renderQuestions();
    </script>


<script>


function salvarRanking(nome, pontos, tempo) {
    let ranking = JSON.parse(localStorage.getItem('rankingQuiz')) || [];

    ranking.push({
        nome: nome || 'Jogador',
        pontos: pontos,
        tempo: tempo
    });

    ranking.sort((a,b) => b.pontos - a.pontos);

    ranking = ranking.slice(0,10);

    localStorage.setItem('rankingQuiz', JSON.stringify(ranking));

    mostrarRanking();
}

function mostrarRanking() {
    let ranking = JSON.parse(localStorage.getItem('rankingQuiz')) || [];

    let html = '<ol>';

    ranking.forEach(r => {
        html += `<li><strong>${r.nome}</strong> - ${r.pontos} pts - ${r.tempo}</li>`;
    });

    html += '</ol>';

    let lista = document.getElementById('rankingLista');

    if(lista){
        lista.innerHTML = html;
    }
}

window.addEventListener('load', mostrarRanking);


// Evita reinícios duplicados e competição entre temporizadores.

</script>
